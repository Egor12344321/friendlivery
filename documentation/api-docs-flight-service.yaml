openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
- url: http://localhost:8083
  description: Generated server url
paths:
  /api/couriers/routes:
    get:
      tags:
      - Courier Profile management
      description: Получить все созданные пути курьера по id
      operationId: getUserRoutes
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourierRoute"
    post:
      tags:
      - Courier Profile management
      description: "Создать путь для пользователя по id, по которому он хочет взят\
        ь посылку"
      operationId: createRoute
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourierRouteRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CourierRoute"
  /api/couriers/profile:
    get:
      tags:
      - Courier Profile management
      description: Получить профиль курьера по id
      operationId: getProfile
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CourierProfile"
    post:
      tags:
      - Courier Profile management
      description: Создать профиля курьера
      operationId: createProfile
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: integer
          format: int64
      - name: X-User-Verification-Status
        in: header
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCourierProfileRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/matching/deliveries:
    get:
      tags:
      - Matching deliveries
      description: Получить все подходящие заявки на доставку для курьера в соответствии
        с его созданными маршрутами
      operationId: getMatchingDeliveries
      parameters:
      - name: X-User-Id
        in: header
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeliveryDto"
components:
  schemas:
    CourierRouteRequest:
      type: object
      properties:
        departureAirport:
          type: string
        arrivalAirport:
          type: string
        priority:
          type: integer
          format: int32
        flightDate:
          type: string
          format: date
    CourierRoute:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        departureAirport:
          type: string
        arrivalAirport:
          type: string
        flightDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        active:
          type: boolean
    CreateCourierProfileRequest:
      type: object
      properties:
        maxWeight:
          type: number
          format: double
        preferredAirlines:
          type: string
        notificationEnabled:
          type: boolean
        contactPreference:
          type: string
    DeliveryDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fromAirport:
          type: string
        toAirport:
          type: string
        deliveryDeadline:
          type: string
          format: date
        desiredDate:
          type: string
          format: date
        weight:
          type: number
          format: double
        price:
          type: number
        status:
          type: string
    CourierProfile:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        maxWeight:
          type: number
          format: double
        preferredAirlines:
          type: string
        notificationEnabled:
          type: boolean
        contactPreference:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
